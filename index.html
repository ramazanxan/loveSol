<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Для тебя 💌</title>
<meta property="og:title" content="Для тебя 💌">
<meta property="og:description" content="Открой, это важно 🌸">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #fff0f5;
    --bg2: #ffe1ec;
    --ink: #4a2233;
    --muted: #8a5a6c;
    --accent: #ff4f8b;
    --accent-2: #ff8fb3;
    --card: rgba(255, 255, 255, .82);
    --shadow: 0 20px 50px rgba(214, 51, 108, .18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(circle at 20% 10%, #fff 0%, var(--bg1) 40%, var(--bg2) 100%);
    background-color: var(--bg1);
    overflow: hidden;
    min-height: 100dvh;
  }
  .hand { font-family: "Caveat", cursive; }

  /* ---------- Screen 1: flower wall ---------- */
  #flowers {
    position: fixed; inset: 0; z-index: 50;
    background: linear-gradient(160deg, #ffd6e5, #ffc2d6 50%, #ffb3cc);
    overflow: hidden; cursor: pointer;
  }
  .flower {
    position: absolute;
    will-change: transform, opacity;
    animation: sway var(--dur, 4s) ease-in-out var(--delay, 0s) infinite alternate;
  }
  .flower svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 6px rgba(160, 30, 80, .18)); }
  @keyframes sway {
    from { transform: rotate(calc(var(--rot, 0deg) - 8deg)) scale(1); }
    to   { transform: rotate(calc(var(--rot, 0deg) + 8deg)) scale(1.05); }
  }
  .flower.fly {
    animation: none;
    transition: transform 1.1s cubic-bezier(.2, .7, .3, 1), opacity 1.1s ease;
  }
  #tapHint {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 5; text-align: center; pointer-events: none;
    background: rgba(255, 255, 255, .88); padding: 22px 30px; border-radius: 28px;
    box-shadow: var(--shadow); width: max-content; max-width: calc(100vw - 32px);
    transition: opacity .4s ease, transform .4s ease;
  }
  #tapHint .big { font-size: clamp(34px, 9vw, 52px); line-height: 1; color: var(--accent); }
  #tapHint .small { margin-top: 8px; font-size: 15px; color: var(--muted); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }

  /* ---------- Common screens ---------- */
  .screen {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; overflow-y: auto;
    opacity: 0; pointer-events: none; transition: opacity .6s ease;
  }
  .screen.show { opacity: 1; pointer-events: auto; }
  .card {
    width: 100%; max-width: 440px; text-align: center;
    background: var(--card); backdrop-filter: blur(8px);
    border-radius: 32px; padding: 34px 26px 30px;
    box-shadow: var(--shadow); border: 1px solid rgba(255, 255, 255, .9);
    transform: translateY(20px) scale(.97); transition: transform .7s cubic-bezier(.2, .8, .2, 1);
    margin: auto;
  }
  .screen.show .card { transform: none; }

  /* ---------- Screen 2: question ---------- */
  #face { font-size: 76px; line-height: 1; display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-4deg); } }
  .hello { font-size: 30px; margin: 14px 0 4px; color: var(--accent); }
  .msg { font-size: 16px; line-height: 1.5; color: var(--muted); margin: 0 0 18px; white-space: pre-line; min-height: 1.5em; }
  .question { font-size: clamp(34px, 8.5vw, 44px); line-height: 1.05; margin: 6px 0 26px; }
  .buttons { display: flex; gap: 16px; justify-content: center; align-items: center; min-height: 64px; flex-wrap: wrap; }
  .btn {
    font: 800 18px "Nunito", sans-serif; border: 0; cursor: pointer;
    padding: 14px 34px; border-radius: 999px; transition: transform .25s ease, box-shadow .25s ease;
    user-select: none; touch-action: manipulation;
  }
  #yesBtn {
    background: linear-gradient(135deg, var(--accent), #ff7aa8); color: #fff;
    box-shadow: 0 10px 24px rgba(255, 79, 139, .4);
    transform: scale(var(--grow, 1)); position: relative; z-index: 3;
  }
  #yesBtn:hover { box-shadow: 0 14px 30px rgba(255, 79, 139, .55); }
  #noBtn {
    background: #fff; color: var(--muted); border: 2px solid #f3c6d6;
    z-index: 20; white-space: nowrap;
  }
  #noBtn.runaway { position: fixed; transition: left .28s ease, top .28s ease, transform .2s; }
  .tease { margin-top: 18px; font-size: 22px; color: var(--accent); min-height: 30px; }

  /* ---------- Screen 3: invitation ---------- */
  .yay { font-size: clamp(40px, 11vw, 56px); color: var(--accent); margin: 0; line-height: 1; }
  .yay-sub { color: var(--muted); margin: 8px 0 22px; font-size: 16px; }
  .ticket {
    position: relative; text-align: left;
    background: #fff; border-radius: 22px; padding: 22px 20px 18px;
    border: 2px dashed #ffc1d6;
  }
  .ticket::before, .ticket::after {
    content: ""; position: absolute; top: 50%; width: 22px; height: 22px; margin-top: -11px;
    background: var(--bg2); border-radius: 50%;
  }
  .ticket::before { left: -12px; } .ticket::after { right: -12px; }
  .ticket h2 { margin: 0 0 14px; text-align: center; font-size: 30px; color: var(--ink); }
  .row { display: flex; gap: 12px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid #fde3ec; }
  .row:last-child { border-bottom: 0; }
  .row .ico { font-size: 22px; width: 30px; text-align: center; flex: none; }
  .row .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #c07b95; font-weight: 800; }
  .row .val { font-size: 17px; font-weight: 600; word-break: break-word; }
  .row .val a { color: var(--accent); text-decoration: none; border-bottom: 1px dashed currentColor; }
  .countdown { margin: 20px 0 6px; font-size: 14px; color: var(--muted); }
  .countdown b { display: block; font-size: 22px; color: var(--ink); margin-top: 4px; font-weight: 800; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .ghost {
    font: 700 14px "Nunito", sans-serif; color: var(--accent); background: #fff;
    border: 2px solid #ffc1d6; padding: 10px 18px; border-radius: 999px; text-decoration: none; cursor: pointer;
  }
  .sign { margin-top: 18px; font-size: 26px; color: var(--muted); }

  /* ---------- falling hearts ---------- */
  .fall {
    position: fixed; top: -40px; z-index: 40; pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translate(var(--dx, 0), 110vh) rotate(var(--r, 360deg)); opacity: .9; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flower, #face { animation: none; }
  }
</style>
</head>
<body>

<!-- Screen 1 -->
<div id="flowers" role="button" aria-label="Нажми на цветы">
  <div id="tapHint">
    <div class="big hand" id="introText">Это для тебя 💌</div>
    <div class="small">нажми на цветочки</div>
  </div>
</div>

<!-- Screen 2 -->
<section class="screen" id="ask">
  <div class="card">
    <div id="face">🥹</div>
    <div class="hello hand" id="hello">Привет!</div>
    <p class="msg" id="msg"></p>
    <div class="question hand" id="question">Пойдёшь со мной на свидание?</div>
    <div class="buttons">
      <button class="btn" id="yesBtn">Да 💖</button>
      <button class="btn" id="noBtn">Нет</button>
    </div>
    <div class="tease hand" id="tease"></div>
  </div>
</section>

<!-- Screen 3 -->
<section class="screen" id="invite">
  <div class="card">
    <p class="yay hand">Ура! 🥰</p>
    <p class="yay-sub" id="yaySub">Я знал, что ты согласишься</p>
    <div class="ticket">
      <h2 class="hand">Приглашение на свидание</h2>
      <div id="rows"></div>
    </div>
    <div class="countdown" id="countdown"></div>
    <div class="actions">
      <a class="ghost" id="calBtn" target="_blank" rel="noopener">📅 В календарь</a>
    </div>
    <div class="sign hand" id="sign"></div>
  </div>
</section>

<script>
(() => {
  /* ---------- config (from #i=... link made in admin.html) ---------- */
  const DEFAULTS = {
    to: "Соледад",
    from: "",
    intro: "Это для тебя 💌",
    message: "Я долго думал, как бы тебе это сказать…\nИ решил сказать красиво 🌸",
    question: "Пойдёшь со мной на свидание?",
    yesText: "Я знал, что ты согласишься 💖",
    date: "", time: "19:00", place: "Сюрприз 🤫", address: "", mapUrl: "",
    dress: "", note: ""
  };

  function decode(str) {
    str = str.replace(/-/g, "+").replace(/_/g, "/");
    while (str.length % 4) str += "=";
    const bytes = Uint8Array.from(atob(str), c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  let cfg = { ...DEFAULTS };
  try {
    const m = location.hash.match(/[#&]i=([^&]+)/);
    if (m) cfg = { ...DEFAULTS, ...decode(m[1]) };
  } catch (e) { console.warn("bad invite link", e); }

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  $("introText").textContent = cfg.intro;
  $("hello").textContent = cfg.to ? `Привет, ${cfg.to}!` : "Привет!";
  $("question").textContent = cfg.question;
  $("yaySub").textContent = cfg.yesText;
  $("sign").textContent = cfg.from ? `Жду тебя, ${cfg.from} ♡` : "Жду тебя ♡";

  /* ---------- Screen 1: flower wall ---------- */
  const PALETTES = [
    ["#ff6f9f", "#ffb3cb"], ["#ff4f8b", "#ff9dbd"], ["#ffffff", "#ffe0ea"],
    ["#ff90b3", "#ffd1df"], ["#e84a7f", "#ff8fb3"], ["#ffc8dd", "#fff0f5"],
    ["#c86bfa", "#e7c1ff"], ["#ff8a65", "#ffc3ad"]
  ];
  function flowerSVG(petals, [c1, c2]) {
    let p = "";
    for (let i = 0; i < petals; i++) {
      const a = (360 / petals) * i;
      p += `<ellipse cx="50" cy="27" rx="15" ry="25" fill="url(#g)" transform="rotate(${a} 50 50)"/>`;
    }
    const id = "g";
    return `<svg viewBox="0 0 100 100"><defs><radialGradient id="${id}" cx="50%" cy="80%" r="80%">
      <stop offset="0" stop-color="${c2}"/><stop offset="1" stop-color="${c1}"/></radialGradient></defs>
      ${p}<circle cx="50" cy="50" r="12" fill="#ffd54f"/><circle cx="50" cy="50" r="6" fill="#ffb300"/></svg>`;
  }
  const wall = $("flowers");
  let flowers = [];
  let builtFor = "";
  function buildWall() {
    const W = innerWidth, H = innerHeight;
    if (!W || !H || builtFor === W + "x" + H) return;
    builtFor = W + "x" + H;
    flowers.forEach(f => f.remove());
    flowers = [];
    const cell = Math.max(52, Math.min(W, H) / 6.5);
    for (let y = -cell / 2; y < H + cell / 2; y += cell * 0.72) {
      for (let x = -cell / 2; x < W + cell / 2; x += cell * 0.72) {
        const el = document.createElement("div");
        el.className = "flower";
        const size = cell * (0.9 + Math.random() * 0.6);
        const px = x + (Math.random() - 0.5) * cell * 0.5;
        const py = y + (Math.random() - 0.5) * cell * 0.5;
        el.style.cssText = `width:${size}px;height:${size}px;left:${px - size / 2}px;top:${py - size / 2}px;` +
          `--rot:${Math.random() * 360}deg;--dur:${3 + Math.random() * 3}s;--delay:${-Math.random() * 4}s;` +
          `z-index:${Math.floor(Math.random() * 3)}`;
        // unique gradient id per flower
        el.innerHTML = flowerSVG(5 + Math.floor(Math.random() * 3), PALETTES[Math.floor(Math.random() * PALETTES.length)])
          .replace(/id="g"/, `id="g${flowers.length}"`).replace(/url\(#g\)/g, `url(#g${flowers.length})`);
        el._cx = px; el._cy = py;
        wall.appendChild(el);
        flowers.push(el);
      }
    }
  }
  buildWall();
  let rt;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (!opened) buildWall(); }, 150); });

  let opened = false;
  function burst(e) {
    if (opened) return;
    opened = true;
    const ox = e.clientX ?? innerWidth / 2, oy = e.clientY ?? innerHeight / 2;
    $("tapHint").style.opacity = 0;
    $("tapHint").style.transform = "translate(-50%,-50%) scale(1.3)";
    const far = Math.hypot(innerWidth, innerHeight);
    flowers.forEach(el => {
      const dx = el._cx - ox, dy = el._cy - oy;
      const d = Math.hypot(dx, dy) || 1;
      const dist = far * (0.6 + Math.random() * 0.6);
      const tx = (dx / d) * dist, ty = (dy / d) * dist - 80;
      el.classList.add("fly");
      el.style.transitionDelay = (d / far) * 0.35 + Math.random() * 0.1 + "s";
      requestAnimationFrame(() => {
        el.style.transform = `translate(${tx}px, ${ty}px) rotate(${(Math.random() - 0.5) * 720}deg) scale(${0.3 + Math.random() * 0.5})`;
        el.style.opacity = 0;
      });
    });
    setTimeout(() => { wall.style.transition = "opacity .6s"; wall.style.opacity = 0; }, 700);
    setTimeout(() => { wall.remove(); }, 1500);
    setTimeout(() => { $("ask").classList.add("show"); typeMessage(); }, 650);
  }
  wall.addEventListener("click", burst);
  wall.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") burst({}); });
  wall.tabIndex = 0;

  function typeMessage() {
    const text = cfg.message || "";
    const el = $("msg");
    let i = 0;
    const t = setInterval(() => {
      el.textContent = text.slice(0, ++i);
      if (i >= text.length) clearInterval(t);
    }, 38);
  }

  /* ---------- Screen 2: runaway "No" ---------- */
  const noBtn = $("noBtn"), yesBtn = $("yesBtn");
  const NO_TEXTS = ["Нет", "Точно нет?", "Подумай ещё 🥺", "Ну пожалуйста!", "Не-а 😏", "Ты уверена?", "Промахнулась 😜",
    "Кнопка сломалась", "Неа, не получится", "Там только «Да» 💖", "Сдавайся 😌"];
  const FACES = ["🥹", "🥺", "😢", "😭", "🙏", "😿", "💔"];
  const TEASES = ["", "Кажется, кнопка стесняется 🙈", "Она убегает от тебя!", "Может, всё-таки «Да»? 🌷",
    "Я не сдамся 😤", "Смотри, какая большая кнопка «Да» 👉", "Ну давай же 💕"];
  let dodges = 0;

  function dodge(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    dodges++;
    const r = noBtn.getBoundingClientRect();
    if (!noBtn.classList.contains("runaway")) {
      noBtn.style.left = r.left + "px"; noBtn.style.top = r.top + "px";
      noBtn.classList.add("runaway");
    }
    const pad = 16;
    const yr = yesBtn.getBoundingClientRect();
    let x, y, tries = 0;
    do {
      x = pad + Math.random() * (innerWidth - r.width - pad * 2);
      y = pad + Math.random() * (innerHeight - r.height - pad * 2);
      tries++;
    } while (tries < 30 && (
      Math.hypot(x - r.left, y - r.top) < 120 ||
      (x < yr.right + 10 && x + r.width > yr.left - 10 && y < yr.bottom + 10 && y + r.height > yr.top - 10)
    ));
    noBtn.style.left = x + "px"; noBtn.style.top = y + "px";
    noBtn.textContent = NO_TEXTS[Math.min(dodges, NO_TEXTS.length - 1)];
    $("face").textContent = FACES[Math.min(dodges, FACES.length - 1)];
    $("tease").textContent = TEASES[Math.min(dodges, TEASES.length - 1)];
    yesBtn.style.setProperty("--grow", Math.min(1 + dodges * 0.12, 1.9));
  }
  noBtn.addEventListener("mouseenter", dodge);
  noBtn.addEventListener("touchstart", dodge, { passive: false });
  noBtn.addEventListener("pointerdown", dodge);
  noBtn.addEventListener("click", dodge);
  noBtn.addEventListener("focus", () => { if (dodges) dodge(); });
  // desktop: run before the cursor even touches it
  document.addEventListener("mousemove", e => {
    if (!$("ask").classList.contains("show") || !noBtn.isConnected) return;
    const r = noBtn.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (Math.hypot(e.clientX - cx, e.clientY - cy) < Math.max(r.width, r.height) * 0.75) dodge();
  });
  addEventListener("resize", () => {
    if (!noBtn.classList.contains("runaway")) return;
    const r = noBtn.getBoundingClientRect();
    noBtn.style.left = Math.min(r.left, innerWidth - r.width - 16) + "px";
    noBtn.style.top = Math.min(r.top, innerHeight - r.height - 16) + "px";
  });

  /* ---------- Screen 3: invitation ---------- */
  yesBtn.addEventListener("click", () => {
    noBtn.remove();
    $("face").textContent = "🥰";
    $("ask").classList.remove("show");
    buildInvite();
    setTimeout(() => $("invite").classList.add("show"), 350);
    rain(70);
  });

  function eventDate() {
    if (!cfg.date) return null;
    const [Y, M, D] = cfg.date.split("-").map(Number);
    const [h, m] = (cfg.time || "00:00").split(":").map(Number);
    return new Date(Y, M - 1, D, h || 0, m || 0);
  }

  function buildInvite() {
    const d = eventDate();
    const rows = [];
    if (cfg.to) rows.push(["💌", "Для", esc(cfg.to)]);
    if (d) {
      const ds = d.toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });
      rows.push(["📅", "Когда", esc(ds.charAt(0).toUpperCase() + ds.slice(1))]);
    }
    if (cfg.time) rows.push(["⏰", "Во сколько", esc(cfg.time)]);
    if (cfg.place || cfg.address) {
      const map = cfg.mapUrl || (cfg.address ? "https://yandex.ru/maps/?text=" + encodeURIComponent(cfg.address) : "");
      let v = esc(cfg.place || "");
      if (cfg.address) v += `${v ? "<br>" : ""}<a href="${esc(map)}" target="_blank" rel="noopener">${esc(cfg.address)}</a>`;
      else if (map) v += ` · <a href="${esc(map)}" target="_blank" rel="noopener">на карте</a>`;
      rows.push(["📍", "Где", v]);
    }
    if (cfg.dress) rows.push(["👗", "Дресс-код", esc(cfg.dress)]);
    if (cfg.note) rows.push(["💬", "P.S.", esc(cfg.note).replace(/\n/g, "<br>")]);
    $("rows").innerHTML = rows.map(([i, l, v]) =>
      `<div class="row"><div class="ico">${i}</div><div><div class="lbl">${l}</div><div class="val">${v}</div></div></div>`).join("");

    if (d) {
      const pad = n => String(n).padStart(2, "0");
      const fmt = x => `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
      const end = new Date(d.getTime() + 3 * 3600e3);
      const q = new URLSearchParams({
        action: "TEMPLATE",
        text: "Свидание 💖" + (cfg.from ? " с " + cfg.from : ""),
        dates: fmt(d) + "/" + fmt(end),
        location: [cfg.place, cfg.address].filter(Boolean).join(", "),
        details: cfg.note || ""
      });
      $("calBtn").href = "https://calendar.google.com/calendar/render?" + q;
      tick(); setInterval(tick, 1000);
    } else {
      $("calBtn").remove();
    }
  }

  function tick() {
    const d = eventDate();
    let ms = d - new Date();
    const el = $("countdown");
    if (ms <= 0) { el.innerHTML = "<b>Уже сегодня! 💖</b>"; return; }
    const days = Math.floor(ms / 864e5); ms %= 864e5;
    const h = Math.floor(ms / 36e5); ms %= 36e5;
    const m = Math.floor(ms / 6e4); const s = Math.floor(ms % 6e4 / 1e3);
    el.innerHTML = `До нашей встречи осталось<b>${days ? days + " д " : ""}${h} ч ${m} мин ${s} с</b>`;
  }

  /* ---------- heart rain ---------- */
  const BITS = ["💖", "💕", "🌸", "💗", "🌷", "✨", "❤️"];
  function rain(n) {
    for (let i = 0; i < n; i++) {
      const s = document.createElement("div");
      s.className = "fall";
      s.textContent = BITS[Math.floor(Math.random() * BITS.length)];
      s.style.left = Math.random() * 100 + "vw";
      s.style.fontSize = 16 + Math.random() * 22 + "px";
      s.style.animationDuration = 2.8 + Math.random() * 3 + "s";
      s.style.animationDelay = Math.random() * 1.8 + "s";
      s.style.setProperty("--dx", (Math.random() - 0.5) * 200 + "px");
      s.style.setProperty("--r", (Math.random() - 0.5) * 720 + "deg");
      document.body.appendChild(s);
      s.addEventListener("animationend", () => s.remove());
    }
  }
  // soft petals on the question screen
  setInterval(() => { if ($("ask").classList.contains("show")) rain(1); }, 900);
})();
</script>
</body>
</html>
